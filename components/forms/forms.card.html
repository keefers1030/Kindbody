<!doctype html><html><head><meta charset="utf-8"><title>Forms</title><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--text-primary);background:var(--kb-white);padding:22px 24px;box-sizing:border-box}.lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--kb-grey-600);margin-bottom:10px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.KindbodyDesignSystem_929fb0;
function Demo(){
  const [c,setC]=React.useState(true);
  const [r,setR]=React.useState('virtual');
  const [s,setS]=React.useState(true);
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 24px'}}>
    <Input label="Email" type="email" required placeholder="you@example.com" />
    <Select label="Location" placeholder="Select a clinic" options={['New York, NY','Chicago, IL','Austin, TX','Virtual']} />
    <Input label="ZIP Code" hint="5-digit" iconLeft="map-pin" defaultValue="10012" />
    <Input label="Phone" error="Enter a 10-digit number" defaultValue="855.563" />
    <div className="col">
      <Checkbox label="Text me appointment reminders" description="Message and data rates may apply." checked={c} onChange={()=>setC(!c)} />
      <Checkbox label="Email me Kindbody updates" checked={false} onChange={()=>{}} />
    </div>
    <div className="col">
      <Radio name="v" label="Virtual consult" description="45 minutes, by video" checked={r==='virtual'} onChange={()=>setR('virtual')} />
      <Radio name="v" label="In clinic" checked={r==='clinic'} onChange={()=>setR('clinic')} />
      <Switch label="Show virtual clinics only" checked={s} onChange={()=>setS(!s)} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
