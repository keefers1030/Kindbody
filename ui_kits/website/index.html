<link rel="icon" href="../../assets/favicon/favicon-192x192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="../../assets/favicon/apple-touch-icon.png">
<style>html,body{margin:0}body{background:var(--kb-cream);font-family:var(--font-sans);color:var(--text-primary)}*{box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}h1,h2,h3{text-wrap:pretty}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicesScreen.jsx"></script>
<script type="text/babel" src="ExpertsScreen.jsx"></script>
<script type="text/babel" src="LocationScreen.jsx"></script>
<script type="text/babel" src="EmployerScreen.jsx"></script>
<script type="text/babel">
const { Dialog, Button, Input } = window.KindbodyDesignSystem_929fb0;
function App(){
  const [route,setRoute]=React.useState('home');
  const [signup,setSignup]=React.useState(false);
  const go=(r)=>{ setRoute(r); window.scrollTo({top:0}); };
  const Screen = { home: HomeScreen, services: ServicesScreen, experts: ExpertsScreen, location: LocationScreen, employer: EmployerScreen }[route] || HomeScreen;
  return (<div>
    <Header onNavigate={go} active={route} />
    <Screen onNavigate={go} onOpenSignup={()=>setSignup(true)} />
    <Footer />
    <Dialog open={signup} onClose={()=>setSignup(false)} title="Start with the Basics"
      footer={<><Button variant="ghost" size="sm" onClick={()=>setSignup(false)}>Not now</Button><Button size="sm" onClick={()=>setSignup(false)}>Sign up</Button></>}>
      <p style={{margin:'0 0 18px'}}>Sign up to watch “Fertility 101,” a plain-language primer on how fertility works and what your options are.</p>
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:12}}>
        <Input label="Email" type="email" required placeholder="you@example.com" />
        <Input label="ZIP Code" hint="5-digit" />
      </div>
    </Dialog>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
