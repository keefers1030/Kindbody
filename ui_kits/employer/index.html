<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState('employer');
  const go=(r)=>{ setRoute(r); window.scrollTo({top:0}); };
  const Screen = route === 'services' ? ServicesScreen : EmployerScreen;
  return (<div><Header onNavigate={go} /><Screen onNavigate={go} /><Footer /></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
