<!doctype html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--text-primary);background:var(--kb-white);padding:20px 24px;box-sizing:border-box}.lbl{font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--kb-grey-600)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--kb-grey-600)}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end">
<div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:4px"></div><div class="mono" style="margin-top:6px">--radius-xs</div><div class="mono">4px</div></div><div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:8px"></div><div class="mono" style="margin-top:6px">--radius-sm</div><div class="mono">8px</div></div><div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:14px"></div><div class="mono" style="margin-top:6px">--radius-md</div><div class="mono">14px</div></div><div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:20px"></div><div class="mono" style="margin-top:6px">--radius-image</div><div class="mono">20px</div></div><div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:24px"></div><div class="mono" style="margin-top:6px">--radius-lg</div><div class="mono">24px</div></div><div><div style="width:84px;height:66px;background:var(--kb-cream);border:1px solid var(--kb-cream-deep);border-radius:36px"></div><div class="mono" style="margin-top:6px">--radius-xl</div><div class="mono">36px</div></div>
<div><div style="width:100px;height:40px;background:var(--kb-yellow);border-radius:999px"></div><div class="mono" style="margin-top:6px">--radius-pill</div></div>
</div></body></html>
