<!doctype html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--text-primary);background:var(--kb-white);padding:20px 24px;box-sizing:border-box}.lbl{font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--kb-grey-600)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--kb-grey-600)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div><div style="height:58px;border-radius:var(--radius-sm);background:#E4EFE8;display:flex;align-items:center;padding:0 12px"><span style="width:12px;height:12px;border-radius:50%;background:#2F6B4F;margin-right:8px"></span><span style="font-size:12.5px;font-weight:700;color:#2F6B4F">Success</span></div><div class="mono" style="margin-top:6px">#2F6B4F / #E4EFE8</div></div><div><div style="height:58px;border-radius:var(--radius-sm);background:#FBF0D8;display:flex;align-items:center;padding:0 12px"><span style="width:12px;height:12px;border-radius:50%;background:#9A6B12;margin-right:8px"></span><span style="font-size:12.5px;font-weight:700;color:#9A6B12">Warning</span></div><div class="mono" style="margin-top:6px">#9A6B12 / #FBF0D8</div></div><div><div style="height:58px;border-radius:var(--radius-sm);background:#F8E4E2;display:flex;align-items:center;padding:0 12px"><span style="width:12px;height:12px;border-radius:50%;background:#A8322B;margin-right:8px"></span><span style="font-size:12.5px;font-weight:700;color:#A8322B">Error</span></div><div class="mono" style="margin-top:6px">#A8322B / #F8E4E2</div></div><div><div style="height:58px;border-radius:var(--radius-sm);background:#E7E8F0;display:flex;align-items:center;padding:0 12px"><span style="width:12px;height:12px;border-radius:50%;background:#272A5E;margin-right:8px"></span><span style="font-size:12.5px;font-weight:700;color:#272A5E">Info</span></div><div class="mono" style="margin-top:6px">#272A5E / #E7E8F0</div></div>
</div></body></html>
